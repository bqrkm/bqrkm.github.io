<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bizim Hikayemiz</title>
<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}

#startScreen {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

button {
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:red;
  color:white;
  cursor:pointer;
}

#content {
  display:none;
}

img {
  width:300px;
  height:400px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 0 20px rgba(255,255,255,0.3);
}

#text {
  font-size:24px;
  margin:20px;
  min-height:40px;
}

.heart {
  position:absolute;
  color:red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform:translateY(0);}
  100% {transform:translateY(-100vh);}
}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Senin İçin Bir Şey Hazırladım ❤️</h1>
  <button onclick="start()">Başlat</button>
</div>

<div id="content">
  <div id="text"></div>
  <img id="photo" src="foto1.jpeg">
</div>

<!-- SESLER -->
<audio id="konusma" src="ses.mp3"></audio>
<audio id="muzik" src="muzik.mp3" loop></audio>

<script src="script.js"></script>
</body>
</html>
