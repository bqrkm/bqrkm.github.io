<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hayatımın Anlamına ❤️</title>

<!-- AOS ANİMASYON -->
<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>
body {
  margin:0;
  background:linear-gradient(135deg,#000,#1a1a2e);
  color:white;
  font-family:Arial;
  text-align:center;
  overflow-x:hidden;
}

/* GİRİŞ */
#intro {
  position:fixed;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

button {
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:red;
  color:white;
  cursor:pointer;
}

/* CONTENT */
.scene {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

img {
  width:320px;
  height:520px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 0 25px rgba(255,255,255,0.3);
}

/* TEXT */
#text {
  font-size:24px;
  margin:20px;
  min-height:40px;
}

/* HEART */
.heart {
  position:fixed;
  color:red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform:translateY(0);}
  100% {transform:translateY(-100vh);}
}
</style>
</head>

<body>

<!-- GİRİŞ -->
<div id="intro">
  <h1>Hazır mısın?</h1>
  <button onclick="startSite()">Başla</button>
</div>

<!-- MÜZİK -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="ses" src="ses.mp3"></audio>

<!-- SAHNE 1 -->
<section class="scene">
  <h2 data-aos="fade-up">Her şey burada başladı...</h2>
</section>

<!-- SAHNE 2 -->
<section class="scene">
  <img id="photo" src="foto1.jpeg" data-aos="zoom-in">
  <div id="text"></div>
</section>

<!-- SAHNE 3 -->
<section class="scene">
  <h2 data-aos="fade-up">Seninle her şey daha güzel ❤️</h2>
</section>

<script src="script.js"></script>

<script>
AOS.init();

// TEXT
const text = "Seninle geçen her an, hayatımın en güzel parçası oldu...";
let i = 0;

// FOTO
let photoIndex = 0;
const fotos = [];
for(let j=1; j<=140; j++){
  fotos.push(`foto${j}.jpeg`);
}

// BAŞLAT
function startSite(){
  document.getElementById("intro").style.display = "none";

  document.getElementById("music").play().catch(()=>{});
  document.getElementById("ses").play().catch(()=>{});

  typeText();
  startSlideshow();
  hearts();
}

// YAZI EFEKT
function typeText(){
  if(i < text.length){
    document.getElementById("text").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText, 50);
  }
}

// FOTO SLAYT
function startSlideshow(){
  setInterval(()=>{
    photoIndex++;
    if(photoIndex >= fotos.length) photoIndex = 0;
    document.getElementById("photo").src = fotos[photoIndex];
  }, 2000);
}

// KALPLER
function hearts(){
  setInterval(()=>{
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20 + 20) + "px";
    document.body.appendChild(heart);
    setTimeout(()=>{ heart.remove(); }, 5000);
  }, 300);
}
</script>

</body>
</html>
