<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bizim Hikayemiz</title>
<style>
body {margin:0; background:black; color:white; font-family:Arial; text-align:center; overflow:hidden;}
#content {display:none;}
#startScreen {width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
button {padding:15px 30px; font-size:18px; border:none; border-radius:10px; background:red; color:white; cursor:pointer;}
img {width:300px; height:400px; object-fit:cover; border-radius:20px; box-shadow:0 0 20px rgba(255,255,255,0.3);}
#text {font-size:24px; margin:20px; min-height:40px;}
.heart {position:absolute; color:red; animation: float 5s linear infinite;}
@keyframes float {0% {transform:translateY(0);} 100% {transform:translateY(-100vh);}}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Senin İçin Bir Şey Hazırladım ❤️</h1>
  <button id="startBtn">Başlat</button>
</div>

<div id="content">
  <div id="text"></div>
  <img id="photo" src="foto1.jpeg">
</div>

<audio id="konusma" src="ses.mp3"></audio>
<audio id="muzik" src="muzik.mp3" loop></audio>

<script>
let text = "Seninle geçen her an, hayatımın en güzel parçası oldu...";
let i = 0;
let photoIndex = 0;
const fotos = ["foto1.jpeg","foto2.jpeg","foto3.jpeg","foto4.jpeg","foto5.jpeg","foto6.jpeg","foto7.jpeg","foto8.jpeg","foto9.jpeg","foto10.jpeg","foto11.jpeg","foto12.jpeg","foto13.jpeg"];

document.getElementById("startBtn").addEventListener("click", () => {
  const startBtn = document.getElementById("startBtn");
  startBtn.disabled = true; // tekrar tıklamayı engelle

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  const konusma = document.getElementById("konusma");
  const muzik = document.getElementById("muzik");

  // sesi aç
  konusma.volume = 1.0;
  muzik.volume = 0.2;

  // kesin oynat
  konusma.play().catch(() => { console.log("Konuşma oynatılamadı"); });
  muzik.play().catch(() => { console.log("Müzik oynatılamadı"); });

  typeText();
  startSlideshow();
  hearts();
});

// Metni yazdır
function typeText(){
  if(i < text.length){
    document.getElementById("text").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText, 50);
  }
}

// Fotoğraf slaytı
function startSlideshow(){
  setInterval(()=>{
    photoIndex++;
    if(photoIndex >= fotos.length) photoIndex = 0;
    document.getElementById("photo").src = fotos[photoIndex];
  }, 2000);
}

// Kalpler
function hearts(){
  setInterval(()=>{
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20 + 20) + "px";
    document.body.appendChild(heart);
    setTimeout(()=>{ heart.remove(); }, 5000);
  }, 300);
}
</script>
</body>
</html>
