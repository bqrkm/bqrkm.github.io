<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hayatımın Anlamına ❤️</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow-x:hidden;
}

#intro {
  width:100vw;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

button {
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:red;
  color:white;
  cursor:pointer;
}

#content {
  display:none;
}

.scene {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

img {
  width:300px;
  border-radius:20px;
}

#text {
  font-size:24px;
  margin-top:20px;
}

</style>
</head>

<body>

<div id="intro">
  <h1>Hazır mısın?</h1>
  <button onclick="startSite()">Başla</button>
</div>

<div id="content">

  <div class="scene">
    <img id="photo" src="foto1.jpeg">
    <div id="text"></div>
  </div>

  <!-- Scroll alanı -->
  <div style="height:200vh"></div>

</div>

<audio id="music" src="music.mp3" loop></audio>

<script src="script.js"></script>

</body>
</html>
