<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Hayatımın Anlamına <3</title>
<style>
body {margin:0; background:black; color:white; font-family:Arial; text-align:center; overflow:hidden;}
#content {display:none;}
#startScreen {width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
button {padding:15px 30px; font-size:18px; border:none; border-radius:10px; background:red; color:white; cursor:pointer;}
img {width:540px; height:860px; object-fit:cover; border-radius:20px; box-shadow:0 0 20px rgba(255,255,255,0.3);}
#text {font-size:24px; margin:20px; min-height:40px;}
.heart {position:absolute; color:red; animation: float 5s linear infinite;}
@keyframes float {0% {transform:translateY(0);} 100% {transform:translateY(-100vh);}}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Tıkla bakalım Hatun' um ❤️</h1>
  <button id="startBtn">Başlat</button>
</div>

<div id="content">
  <div id="text"></div>
  <img id="photo" src="foto1.jpeg">
</div>

<audio id="ses" src="ses.mp3"></audio>

<script>
const text = "Seninle geçen her an, hayatımın en güzel parçası oldu. Umarım bu parçalar her zaman benimle kalır. İyi ki varsın.";
let i = 0;
let photoIndex = 0;

// 140 fotoğrafı dinamik oluşturuyoruz
const fotos = [];
for(let j=1; j<=140; j++){
  fotos.push(`foto${j}.jpeg`);
}

document.getElementById("startBtn").addEventListener("click", async () => {
  document.getElementById("startBtn").disabled = true;
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("content").style.display = "block";

  const ses = document.getElementById("ses");
  ses.volume = 0.8; // gerekirse ayarla
  try { await ses.play(); } catch(e){ console.log("Ses çalmadı:", e); }

  typeText();
  startSlideshow();
  hearts();
});

function typeText(){
  if(i < text.length){
    document.getElementById("text").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeText, 50);
  }
}

function startSlideshow(){
  setInterval(()=>{
    photoIndex++;
    if(photoIndex >= fotos.length) photoIndex = 0;
    document.getElementById("photo").src = fotos[photoIndex];
  }, 2000);
}

function hearts(){
  setInterval(()=>{
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*20 + 20) + "px";
    document.body.appendChild(heart);
    setTimeout(()=>{ heart.remove(); }, 5000);
  }, 300);
}
</script>

</body>
</html>
